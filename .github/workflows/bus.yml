name: Horaires bus 230

on:
  schedule:
    - cron: "17 2 * * *"   # chaque nuit vers 3h-4h, heure de Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extraire les horaires
        run: python scripts/build_bus.py
      - name: Publier bus.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bus.json
          git diff --cached --quiet || git commit -m "Horaires bus 230 du $(date +%F)"
          git push
